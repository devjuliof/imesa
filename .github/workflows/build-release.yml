name: Build APK & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          eas build --platform android --profile preview --non-interactive --json > build-result.json
          cat build-result.json

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download APK from EAS
        run: |
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build-result.json)
          echo "Downloading APK from: $APK_URL"
          curl -L -o "imesa-${{ steps.version.outputs.VERSION_NUM }}.apk" "$APK_URL"
          cp "imesa-${{ steps.version.outputs.VERSION_NUM }}.apk" imesa.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: iMesa ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ./imesa-${{ steps.version.outputs.VERSION_NUM }}.apk
            ./imesa.apk
          body: |
            ## iMesa ${{ steps.version.outputs.VERSION }}

            ### Download
            Baixe o APK abaixo e instale no tablet.

            > **Nota:** Certifique-se de habilitar "Fontes desconhecidas" nas configurações do Android.
